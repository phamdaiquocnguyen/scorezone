<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- ⚡ ANTI-FOUC SCRIPT: Ngăn chặn chớp sáng khi chuyển trang ở Dark Mode -->
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('scorezone_theme');
                if (theme === 'dark' || (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark-theme');
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
            } catch (e) {}
        })();
    </script>
    <title>Thiết lập mật khẩu mới - ScoreZone</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/dark-theme.css">
</head>
<body class="auth-page-bg">

    <div class="auth-card" role="main">
        <!-- Auth Header -->
        <div class="auth-header">
            <a href="./index.html" class="auth-logo" title="Quay về trang chủ ScoreZone">
                <img src="./assets/css/logo/scorezone-logo.png" alt="ScoreZone Logo">
            </a>
            <h1 class="auth-title">Thiết lập mật khẩu mới</h1>
            <p class="auth-subtitle">Mật khẩu của bạn phải có ít nhất 8 ký tự, bao gồm cả chữ cái và số để bảo mật.</p>
        </div>

        <!-- Auth Form -->
        <form class="auth-form" id="resetPasswordForm">
            <!-- New Password Field -->
            <div class="auth-field-group">
                <label class="auth-label" for="inputNewPassword">MẬT KHẨU MỚI <span class="required">*</span></label>
                <div class="auth-input-wrap">
                    <div class="auth-input-left-icon">
                        <img src="./assets/img/figma/a8366a27084d855e97ea9080e099f11689cbab49.png" alt="Lock">
                    </div>
                    <input type="password" id="inputNewPassword" class="auth-input" placeholder="Nhập mật khẩu mới" required minlength="8" value="12345678">
                    <button type="button" class="auth-eye-btn" aria-label="Hiện mật khẩu" onclick="togglePasswordVisibility('inputNewPassword')">
                        <img src="./assets/img/figma/c20910d150621cdbd0550ad894294452dd2bad1c.png" alt="Show/Hide">
                    </button>
                </div>
            </div>

            <!-- Confirm New Password Field -->
            <div class="auth-field-group">
                <label class="auth-label" for="inputConfirmPassword">XÁC NHẬN MẬT KHẨU MỚI <span class="required">*</span></label>
                <div class="auth-input-wrap">
                    <div class="auth-input-left-icon">
                        <img src="./assets/img/figma/13669e00690834a1d8732d8acd9de4125c1bdb36.png" alt="Confirm Lock">
                    </div>
                    <input type="password" id="inputConfirmPassword" class="auth-input" placeholder="Nhập lại mật khẩu mới" required minlength="8" value="12345678">
                    <button type="button" class="auth-eye-btn" aria-label="Hiện mật khẩu" onclick="togglePasswordVisibility('inputConfirmPassword')">
                        <img src="./assets/img/figma/c20910d150621cdbd0550ad894294452dd2bad1c.png" alt="Show/Hide">
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-auth-primary" id="btnResetSubmit" style="margin-top: 12px;">Cập nhật mật khẩu</button>

            <!-- Back to login -->
            <a href="./login.html" class="auth-back-link">QUAY LẠI ĐĂNG NHẬP</a>
        </form>
    </div>

    <!-- Global Toast Notification -->
    <div class="sz-toast" id="szToastNotification" role="status" aria-live="polite">
        <span id="szToastMessage">Cập nhật mật khẩu thành công</span>
    </div>

    <!-- Scripts -->
    <script>
        const szToast = document.getElementById('szToastNotification');
        const szToastMsg = document.getElementById('szToastMessage');
        let toastTimeout = null;
        function showToast(msg) {
            if (!szToast || !szToastMsg) return;
            szToastMsg.textContent = msg;
            szToast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                szToast.classList.remove('show');
            }, 3000);
        }

        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            if (input) {
                input.type = input.type === 'password' ? 'text' : 'password';
            }
        }

        const resetPasswordForm = document.getElementById('resetPasswordForm');
        if (resetPasswordForm) {
            resetPasswordForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const pwd = document.getElementById('inputNewPassword').value;
                const confirmPwd = document.getElementById('inputConfirmPassword').value;

                if (pwd !== confirmPwd) {
                    showToast('Mật khẩu xác nhận không khớp!');
                    return;
                }

                showToast('Cập nhật mật khẩu thành công! Đang chuyển hướng...');
                setTimeout(() => {
                    window.location.href = './login.html';
                }, 1000);
            });
        }
    </script>
    <!-- Auth State Management -->
    <script src="./assets/js/auth.js"></script>
    <!-- Theme State Management -->
    <script src="./assets/js/theme.js"></script>
</body>
</html>
