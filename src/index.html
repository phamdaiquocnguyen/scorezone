<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScoreZone - Header</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>

    <header id="header">
        
        <!-- ================= TRÁI: LOGO ================= -->
        <div class="header-left">
            <a href="#" class="logo">
                <img src="./assets/css/logo/scorezone-logo.png" alt="ScoreZone Logo" class="logo-img">
            </a>
        </div>

        <!-- ================= GIỮA: NAVIGATION ================= -->
        <nav id="nav">
            <ul>
                <!-- Class 'active' dành cho trang đang được chọn -->
                <li class="active"><a href="#">Trang chủ</a></li>
                <li><a href="#">Giải đấu</a></li>
                <li><a href="#">Tin tức</a></li>
                <li><a href="#">Lịch & Kết quả</a></li>
                <li><a href="#">Bảng xếp hạng</a></li>
            </ul>
        </nav>

        <!-- ================= PHẢI: TÌM KIẾM & USER ================= -->
        <div class="header-right">
            
            <!-- Ô tìm kiếm -->
            <div class="search-box">
                <input type="text" placeholder="Tìm kiếm">
                <button class="search-btn">
                    <img src="./assets/css/icons/search-icon.svg" alt="Search">
                </button>
            </div>

            <!-- Icon Cài đặt -->
            <a href="#" class="icon-btn">
                <img src="./assets/css/icons/settings-icon.svg" alt="Settings">
            </a>

            <!-- Avatar User -->
            <a href="#" class="user-avatar">
                <img src="./assets/css/icons/user-icon.svg" alt="User">
            </a>

        </div>

    </header>

</body>
</html>
