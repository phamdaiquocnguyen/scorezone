<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - ScoreZone</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="auth-page-bg">

    <div class="auth-card" role="main">
        <!-- Auth Header -->
        <div class="auth-header">
            <a href="./index.html" class="auth-logo" title="Quay về trang chủ ScoreZone">
                <img src="./assets/css/logo/scorezone-logo.png" alt="ScoreZone Logo">
            </a>
            <h1 class="auth-title">Quên mật khẩu</h1>
            <p class="auth-subtitle">Đừng lo, hãy cung cấp email đã đăng ký. ScoreZone sẽ gửi cho bạn hướng dẫn để tạo mật khẩu mới ngay lập tức.</p>
        </div>

        <!-- Auth Form -->
        <form class="auth-form" id="forgotForm">
            <!-- Email Field -->
            <div class="auth-field-group">
                <label class="auth-label" for="forgotEmail">EMAIL <span class="required">*</span></label>
                <div class="auth-input-wrap">
                    <div class="auth-input-left-icon">
                        <img src="./assets/img/figma/4169fa49cfdb1f534d80b7607b0d474085e2fcaf.png" alt="Email">
                    </div>
                    <input type="email" id="forgotEmail" class="auth-input" placeholder="Địa chỉ email" required value="ie106n12@email.com">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-auth-primary" id="btnForgotSubmit" style="margin-top: 12px;">Tiếp tục</button>

            <!-- Back to login -->
            <a href="./login.html" class="auth-back-link">QUAY LẠI ĐĂNG NHẬP</a>
        </form>
    </div>

    <!-- Global Toast Notification -->
    <div class="sz-toast" id="szToastNotification" role="status" aria-live="polite">
        <span id="szToastMessage">Đã gửi mã xác nhận</span>
    </div>

    <!-- Scripts -->
    <script>
        const szToast = document.getElementById('szToastNotification');
        const szToastMsg = document.getElementById('szToastMessage');
        let toastTimeout = null;
        function showToast(msg) {
            if (!szToast || !szToastMsg) return;
            szToastMsg.textContent = msg;
            szToast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                szToast.classList.remove('show');
            }, 3000);
        }

        const forgotForm = document.getElementById('forgotForm');
        if (forgotForm) {
            forgotForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('forgotEmail').value;
                showToast('Đang gửi mã xác nhận đến email...');
                setTimeout(() => {
                    window.location.href = `./verify-otp.html?email=${encodeURIComponent(email)}`;
                }, 800);
            });
        }
    </script>
    <!-- Auth State Management -->
    <script src="./assets/js/auth.js"></script>
</body>
</html>
